<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYMASTER 2604 NOTAMs</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --nerv-orange: #FF9830;
    --nerv-orange-dim: #C87020;
    --nerv-orange-hot: #FFCC50;
    --nerv-green: #50FF50;
    --nerv-green-dim: #30BB30;
    --nerv-cyan: #20F0FF;
    --nerv-cyan-dim: #10A0B0;
    --nerv-red: #FF3030;
    --nerv-red-dim: #CC2020;
    --nerv-amber: #FFAA00;
    --nerv-yellow: #FFE820;
    --nerv-magenta: #F030C0;
    --nerv-steel: #D8D8D0;
    --nerv-steel-dim: #888880;
    --nerv-void: #000000;
    --nerv-panel: #0C0C0A;
  }

  body {
    background: var(--nerv-void);
    color: var(--nerv-orange);
    font-family: 'ITC Avant Garde Gothic', 'Barlow Semi Condensed', sans-serif;
    overflow: hidden;
    height: 100vh;
    position: relative;
  }

  #map { width: 100%; height: 100vh; z-index: 2; position: relative; }

  .leaflet-tile-pane { filter: sepia(1) saturate(4) hue-rotate(-10deg) brightness(0.9); will-change: filter; transform: translateZ(0); }
  .leaflet-control-attribution { display: none !important; }
  .leaflet-control-zoom a {
    background: var(--nerv-void) !important;
    color: var(--nerv-orange) !important;
    border: 1px solid var(--nerv-orange-dim) !important;
    border-radius: 0 !important;
    font-family: 'JetBrains Mono', monospace !important;
    font-weight: 700 !important;
    font-size: 14px !important;
  }
  .leaflet-control-zoom a:hover { background: rgba(255,152,48,0.08) !important; }
  .leaflet-control-zoom { border-radius: 0 !important; }
  .leaflet-top { top: 54px; }

  /* HEADER */
  .hud-header {
    position: fixed; top: 0; left: 0; right: 0; height: 44px;
    background: var(--nerv-void);
    display: flex; align-items: center; padding: 0 16px;
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .header-class-mark {
    font-family: 'ITC Avant Garde Gothic', 'Barlow Semi Condensed', sans-serif;
    font-weight: 700; font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #FFFFFF; background: var(--nerv-red);
    padding: 2px 8px; margin-right: 14px;
  }
  .hud-header h1 {
    font-family: 'ITC Avant Garde Gothic', 'Barlow Semi Condensed', sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: 0.04em;
    color: #FFFFFF;
  }
  .header-jp {
    font-family: 'Shippori Mincho B1', serif;
    font-weight: 700; font-size: 12px;
    color: rgba(255,255,255,0.35);
    margin-left: 12px; transform: scaleX(0.82); transform-origin: left center;
  }
  .header-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.15); margin: 0 14px; }
  .hud-clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 700; color: #FFFFFF;
    letter-spacing: 0.08em; margin-left: auto;
    font-variant-numeric: tabular-nums;
  }
  .header-status {
    display: flex; align-items: center; gap: 6px; margin-left: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500; font-size: 9px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--nerv-red);
  }
  .header-url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 400; color: var(--nerv-red);
    margin-left: 10px; letter-spacing: 0.04em;
  }
  .status-led {
    width: 6px; height: 6px;
    background: var(--nerv-red); box-shadow: 0 0 6px var(--nerv-red);
    animation: led-blink 1s infinite;
  }
  @keyframes led-blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* INPUT PANEL */
  .input-panel {
    position: fixed; top: 54px; left: 10px; width: 430px;
    z-index: 1000; background: var(--nerv-void);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .panel-title-bar {
    background: rgba(255,255,255,0.04);
    padding: 4px 10px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .panel-title-bar span {
    font-family: 'ITC Avant Garde Gothic', 'Barlow Semi Condensed', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    color: #FFFFFF;
  }
  .panel-title-bar .jp-sub {
    font-family: 'Shippori Mincho B1', serif;
    font-weight: 700; font-size: 10px; color: rgba(255,255,255,0.25);
    transform: scaleX(0.82); transform-origin: left center; display: inline-block;
  }
  .panel-body { padding: 10px; }
  .input-panel textarea {
    width: 100%; height: 90px;
    background: var(--nerv-void);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 0;
    color: #D8D8D0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 400;
    padding: 6px 8px; resize: vertical; outline: none;
  }
  .input-panel textarea:focus { border-color: rgba(255,255,255,0.4); }
  .input-panel textarea::placeholder { color: rgba(255,255,255,0.12); }
  .input-hint {
    font-size: 9px; font-weight: 500; letter-spacing: 0.08em;
    color: rgba(255,255,255,0.3); margin-top: 4px; text-transform: uppercase;
  }
  .btn-row { display: flex; gap: 4px; margin-top: 8px; }
  .btn {
    flex: 1; padding: 5px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    border: 1px solid; border-radius: 0;
    cursor: pointer; background: var(--nerv-void);
  }
  .btn-add { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); }
  .btn-add:hover { background: rgba(255,255,255,0.06); color: #FFFFFF; }
  .btn-clear { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); flex: 0.35; }
  .btn-clear:hover { background: rgba(255,255,255,0.06); color: #FFFFFF; }
  .btn-fit { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); flex: 0.3; }
  .btn-fit:hover { background: rgba(255,255,255,0.06); color: #FFFFFF; }

  .collapse-toggle {
    position: absolute; top: 2px; right: 6px;
    background: none; border: none; color: rgba(255,255,255,0.25);
    cursor: pointer; font-size: 13px;
    font-family: 'JetBrains Mono', monospace; padding: 2px 4px;
  }
  .collapse-toggle:hover { color: #FFFFFF; }
  .input-panel.collapsed .panel-body { display: none; }

  /* NOTAM LIST */
  .notam-list-panel {
    position: fixed; top: 54px; right: 10px; width: 360px;
    max-height: calc(100vh - 130px);
    z-index: 1000; background: var(--nerv-void);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; flex-direction: column;
  }
  .notam-list-header {
    background: rgba(255,255,255,0.04);
    padding: 4px 10px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
    cursor: pointer;
  }
  .notam-list-header:hover { background: rgba(255,255,255,0.08); }
  .list-collapse-toggle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: rgba(255,255,255,0.5);
    margin-left: 6px; user-select: none;
  }
  .notam-list-panel.collapsed .notam-list-body { display: none; }
  .notam-list-panel.collapsed .notam-list-header { border-bottom: none; }

  /* Expired NOTAM cards — collapsed to just the header by default */
  .notam-card.expired .notam-card-details,
  .notam-card.expired .notam-card-text { display: none; }
  .notam-card.expired .notam-card-id {
    opacity: 0.55;
    cursor: pointer;
  }
  .notam-card.expired .notam-card-id::before {
    content: '+ ';
    opacity: 0.6;
  }
  .notam-card.expired.expanded .notam-card-details,
  .notam-card.expired.expanded .notam-card-text { display: block; }
  .notam-card.expired.expanded .notam-card-id { opacity: 0.7; }
  .notam-card.expired.expanded .notam-card-id::before {
    content: '− ';
  }
  .notam-card.expired .notam-card-type { opacity: 0.4; }
  .notam-list-header h3 {
    font-family: 'ITC Avant Garde Gothic', 'Barlow Semi Condensed', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    color: #FFFFFF;
  }
  .notam-list-header .jp-sub {
    font-family: 'Shippori Mincho B1', serif;
    font-weight: 700; font-size: 10px; color: rgba(255,255,255,0.25);
    transform: scaleX(0.82); transform-origin: left center;
    display: inline-block; margin-left: 6px;
  }
  .notam-list-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 700; color: #FFFFFF;
    font-variant-numeric: tabular-nums;
  }
  .notam-list-body { overflow-y: auto; flex: 1; padding: 4px; }
  .notam-list-body::-webkit-scrollbar { width: 3px; }
  .notam-list-body::-webkit-scrollbar-track { background: var(--nerv-void); }
  .notam-list-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }

  .notam-card {
    background: var(--nerv-void);
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 5px 8px;
    cursor: pointer; transition: background 0.1s;
  }
  .notam-card:hover { background: rgba(255,255,255,0.03); }
  .notam-card.dimmed { opacity: 0.2; }
  .notam-card-header { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .notam-card-id {
    font-family: 'ITC Avant Garde Gothic', 'Barlow Semi Condensed', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em; flex: 1;
    color: #FFFFFF;
  }
  .notam-card-type {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px; font-weight: 700; letter-spacing: 0.08em;
    padding: 1px 5px; border: 1px solid rgba(255,255,255,0.15);
    text-transform: uppercase; color: rgba(255,255,255,0.55);
    white-space: nowrap;
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .notam-card-remove {
    background: none; border: none; color: rgba(255,255,255,0.2);
    cursor: pointer; font-size: 10px; padding: 0 3px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
  }
  .notam-card-remove:hover { color: var(--nerv-red); }
  .notam-card-details {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 400; line-height: 1.4; color: rgba(255,255,255,0.45);
  }
  .notam-card-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px; font-weight: 400; color: rgba(255,255,255,0.2);
    margin-top: 3px; padding-top: 3px;
    border-top: 1px solid rgba(255,255,255,0.04);
    line-height: 1.2; max-height: 32px; overflow: hidden; word-break: break-all;
  }
  .no-data {
    color: rgba(255,255,255,0.3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; padding: 12px; text-align: center;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .no-data .jp-empty {
    font-family: 'Shippori Mincho B1', serif;
    font-weight: 700; font-size: 10px; color: rgba(255,255,255,0.15);
    transform: scaleX(0.82); display: inline-block; margin-top: 4px;
  }

  /* TIMELINE */
  .timeline-panel {
    position: fixed;
    bottom: 22px; left: 0; right: 0;
    height: 52px;
    background: var(--nerv-void);
    border-top: 1px solid rgba(255,255,255,0.12);
    z-index: 1000;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
  }
  .timeline-panel.hidden { display: none; }

  .timeline-label {
    font-family: 'ITC Avant Garde Gothic', 'Barlow Semi Condensed', sans-serif;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
  }
  .timeline-label .jp-sub {
    font-family: 'Shippori Mincho B1', serif;
    font-weight: 700; font-size: 9px; color: rgba(255,255,255,0.15);
    transform: scaleX(0.82); transform-origin: left center; display: inline-block;
  }

  .timeline-current {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 700;
    color: #FFFFFF;
    font-variant-numeric: tabular-nums;
    min-width: 160px;
    white-space: nowrap;
  }

  .timeline-slider-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    position: relative;
  }

  .timeline-ticks {
    position: relative;
    height: 26px;
    width: 100%;
    pointer-events: none;
  }
  .timeline-ticks .span-bar {
    position: absolute;
    top: 2px;
    bottom: 2px;
    pointer-events: auto;
    border-radius: 1px;
    transition: filter 0.12s, outline 0.12s;
  }
  .timeline-ticks .span-bar:hover {
    filter: brightness(1.6) saturate(1.3);
    outline: 1px solid rgba(255,255,255,0.7);
    z-index: 5;
  }
  .timeline-ticks .tick {
    position: absolute;
    top: 0;
    width: 1px;
    height: 18px;
    background: currentColor;
    opacity: 0.35;
    pointer-events: none;
  }
  .timeline-ticks .tick.start { opacity: 0.45; }
  .timeline-ticks .tick.end { opacity: 0.2; }
  .timeline-ticks .eam-dot {
    position: absolute;
    top: 20px;
    width: 3px;
    height: 4px;
    margin-left: -1px;
    pointer-events: auto;
    border-radius: 1px;
    opacity: 0.85;
  }
  .timeline-ticks .eam-dot:hover {
    transform: scaleY(1.6);
    opacity: 1;
    z-index: 6;
  }

  .timeline-range {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px; color: rgba(255,255,255,0.3);
    font-variant-numeric: tabular-nums;
  }

  .timeline-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    outline: none;
    border-radius: 0;
  }

  .snap-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: var(--nerv-void);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    padding: 3px 7px;
    border-radius: 0;
    line-height: 1;
  }
  .snap-btn:hover { color: #FFFFFF; border-color: rgba(255,255,255,0.4); }
  .timeline-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 20px;
    background: #FFFFFF;
    border: none;
    cursor: pointer;
  }
  .timeline-slider::-moz-range-thumb {
    width: 14px; height: 20px;
    background: #FFFFFF;
    border: none; border-radius: 0;
    cursor: pointer;
  }

  .timeline-active-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    font-variant-numeric: tabular-nums;
    min-width: 80px;
    text-align: right;
    white-space: nowrap;
  }

  .btn-show-all {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.2); border-radius: 0;
    background: var(--nerv-void); color: rgba(255,255,255,0.5);
    padding: 3px 8px; cursor: pointer; white-space: nowrap;
  }
  .btn-show-all:hover { color: #FFFFFF; border-color: rgba(255,255,255,0.4); }
  .btn-show-all.active { color: #FFFFFF; border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.06); }

  /* STATUS BAR */
  .status-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 22px;
    background: var(--nerv-void);
    border-top: 1px solid rgba(255,255,255,0.12);
    z-index: 1000;
    display: flex; align-items: center; padding: 0 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 500; letter-spacing: 0.08em;
    color: rgba(255,255,255,0.3); gap: 16px;
    text-transform: uppercase; font-variant-numeric: tabular-nums;
  }
  .status-bar .s-green { color: rgba(255,255,255,0.4); }
  .status-bar .s-orange { color: rgba(255,255,255,0.25); }
  .status-bar .s-cyan { color: rgba(255,255,255,0.35); }

  /* ON-MAP LABELS — ID only */
  .notam-map-label {
    background: rgba(0,0,0,0.85);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 2px 5px;
    pointer-events: none;
    transition: opacity 0.3s;
    white-space: nowrap;
  }
  .notam-map-label .label-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
  }

  /* Popups */
  .leaflet-popup-content-wrapper {
    background: var(--nerv-void) !important;
    border: 1px solid rgba(255,255,255,0.2) !important;
    border-radius: 0 !important; box-shadow: none !important;
    color: #D8D8D0 !important;
    font-family: 'JetBrains Mono', monospace !important; font-size: 10px !important;
  }
  .leaflet-popup-tip {
    background: var(--nerv-void) !important;
    border: 1px solid rgba(255,255,255,0.2) !important;
    border-radius: 0 !important; box-shadow: none !important;
  }
  .leaflet-popup-content {
    color: #D8D8D0 !important; line-height: 1.5 !important;
    max-width: 300px !important; margin: 8px 10px !important;
  }
  .leaflet-popup-content .popup-title {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-family: 'ITC Avant Garde Gothic', 'Barlow Semi Condensed', sans-serif;
    font-size: 12px; font-weight: 700; letter-spacing: 0.03em;
    color: #FFFFFF;
    margin-bottom: 4px; padding-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .leaflet-popup-content .popup-field { color: rgba(255,255,255,0.5); margin: 2px 0; }
  .leaflet-popup-content .popup-field .f-label {
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; font-size: 8px;
    color: rgba(255,255,255,0.7);
  }
  .leaflet-popup-content .popup-raw {
    font-size: 8px; color: rgba(255,255,255,0.2);
    margin-top: 6px; padding-top: 4px;
    border-top: 1px solid rgba(255,255,255,0.06);
    line-height: 1.3; word-break: break-all;
  }
  .leaflet-popup-content .popup-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .leaflet-popup-content .popup-nav-btn {
    background: var(--nerv-void);
    border: 1px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.7);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 2px 8px;
    cursor: pointer;
    border-radius: 0;
  }
  .leaflet-popup-content .popup-nav-btn:hover {
    color: #FFFFFF;
    border-color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.08);
  }
  .leaflet-popup-content .popup-nav-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.06em;
  }
  .leaflet-tooltip.notam-tooltip {
    background: transparent !important; border: none !important;
    box-shadow: none !important; padding: 0 !important; border-radius: 0 !important;
  }
  .leaflet-tooltip.notam-tooltip::before { display: none !important; }

  .leaflet-popup-close-button { display: none !important; }
  .leaflet-popup-content .popup-title .popup-id { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leaflet-popup-content .popup-badge { font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 700; letter-spacing: 0.08em; padding: 1px 5px; border: 1px solid; text-transform: uppercase; white-space: nowrap; max-width: 65%; overflow: hidden; text-overflow: ellipsis; }
  .notam-card-text { cursor: pointer; transition: background 0.15s, color 0.15s; }
  .notam-card-text:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.55); }
  
  .leaflet-popup-content .popup-raw { cursor: pointer; transition: background 0.15s, color 0.15s; }
  .leaflet-popup-content .popup-raw:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.6); }
  .notam-card-text.copied, .leaflet-popup-content .popup-raw.copied { animation: copy-dip 0.22s ease-out; }

// === PARSERS ===
function parseDMS(str) {
  const re = /(\d{2,3})(\d{2})(\d{2})([NS])\s*(\d{2,4})(\d{2})(\d{2})([EW])/g;
  const coords = []; let m;
  while ((m = re.exec(str)) !== null) {
    let lat = parseInt(m[1]) + parseInt(m[2])/60 + parseInt(m[3])/3600;
    let lng = parseInt(m[5]) + parseInt(m[6])/60 + parseInt(m[7])/3600;
    if (m[4]==='S') lat = -lat;
    if (m[8]==='W') lng = -lng;
    coords.push({ lat, lng, raw: m[0] });
  }
  return coords;
}


function parseAreas(str) {
  if (!str) return [];
  const segments = str.split(/AREA DEFINED AS/i);
  const areas = [];
  for (let i = 1; i < segments.length; i++) {
    const segText = segments[i].split(/POINT OF ORIGIN/i)[0];
    const coords = parseDMS(segText);
    if (coords.length > 0) areas.push(coords);
  }
  return areas;
}

function parseRadius(t) { const m = t.match(/(\d+)\s*NM\s*RADIUS/i); return m ? parseInt(m[1]) : null; }

function parseAlt(t) { const m = t.match(/(SFC|FL\d+|\d+FT)[\s-]*(FL\d+|\d+FT|UNL)?/i); return m ? m[0] : null; }

// Parse NOTAM time string like 2604141400 → Date object
function parseNotamTs(s) {
  if (!s || s.length < 10) return null;
  const yr = 2000 + parseInt(s.slice(0,2));
  const mo = parseInt(s.slice(2,4)) - 1;
  const dy = parseInt(s.slice(4,6));
  const hr = parseInt(s.slice(6,8));
  const mn = parseInt(s.slice(8,10));
  return new Date(Date.UTC(yr, mo, dy, hr, mn));
}

function parseTime(t) {
  // Match the overall validity period (10-digit timestamps)
  const m = t.match(/(\d{10,12})-(\d{10,12})/);
  if (!m) return null;
  const startTs = parseNotamTs(m[1]);
  const endTs = parseNotamTs(m[2]);
  if (!startTs || !endTs) return null;

  // Check for DLY (daily) recurrence window like "DLY 1830-1930"
  const dlyMatch = t.match(/DLY\s+(\d{4})-(\d{4})/i);
  let dailyWindows = null;
  if (dlyMatch) {
    const dlyStart = dlyMatch[1]; // e.g. "1830"
    const dlyEnd = dlyMatch[2];   // e.g. "1930"
    const dlyStartH = parseInt(dlyStart.slice(0,2));
    const dlyStartM = parseInt(dlyStart.slice(2,4));
    const dlyEndH = parseInt(dlyEnd.slice(0,2));
    const dlyEndM = parseInt(dlyEnd.slice(2,4));

    // Build array of active windows for each day in the validity period
    dailyWindows = [];
    const cursor = new Date(startTs);
    while (cursor <= endTs) {
      const winStart = new Date(Date.UTC(cursor.getUTCFullYear(), cursor.getUTCMonth(), cursor.getUTCDate(), dlyStartH, dlyStartM));
      const winEnd = new Date(Date.UTC(cursor.getUTCFullYear(), cursor.getUTCMonth(), cursor.getUTCDate(), dlyEndH, dlyEndM));
      if (winStart >= startTs && winEnd <= new Date(endTs.getTime() + 60000)) {
        dailyWindows.push({ start: winStart.getTime(), end: winEnd.getTime() });
      }
      cursor.setUTCDate(cursor.getUTCDate() + 1);
    }
  }

  function fmtDisplay(d) {
    if (!d) return '??';
    const yr = String(d.getUTCFullYear()).slice(2);
    const mo = String(d.getUTCMonth()+1).padStart(2,'0');
    const dy = String(d.getUTCDate()).padStart(2,'0');
    const hr = String(d.getUTCHours()).padStart(2,'0');
    const mn = String(d.getUTCMinutes()).padStart(2,'0');
    return `${yr}${mo}${dy} ${hr}:${mn} UTC`;
  }

  const dlyLabel = dlyMatch ? ` (DLY ${dlyMatch[1]}-${dlyMatch[2]})` : '';
  return { from: fmtDisplay(startTs), to: fmtDisplay(endTs), startTs, endTs, dailyWindows, dlyLabel };
}

function parseId(t) { const m = t.match(/!(\w+)\s+(\d+\/\d+)/); return m ? `${m[1]} ${m[2]}` : 'UNKNOWN'; }
function nmToM(nm) { return nm * 1852; }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function trunc(s, n) { return s.length > n ? s.slice(0,n) + '...' : s; }

// Format timestamp for timeline display
function fmtTimeline(d) {
  const yr = String(d.getUTCFullYear()).slice(2);
  const mo = String(d.getUTCMonth()+1).padStart(2,'0');
  const dy = String(d.getUTCDate()).padStart(2,'0');
  const hr = String(d.getUTCHours()).padStart(2,'0');
  const mn = String(d.getUTCMinutes()).padStart(2,'0');
  return `${yr}${mo}${dy} ${hr}:${mn} UTC`;
}

// Simple on-map ID label — just the NOTAM ID, placed at center
function makeLabel(centerLL, e) {
  const ll = Array.isArray(centerLL) ? centerLL : [centerLL.lat, centerLL.lng];
  const html = `<div class="notam-map-label" style="border-color:${e.color};">
    <div class="label-id" style="color:${e.color};">${esc(e.id)}</div>
  </div>`;

  return L.marker(ll, {
    icon: L.divIcon({ html, className: 'notam-tooltip', iconSize: [100, 0], iconAnchor: [50, 10] }),
    interactive: false
  }).addTo(map);
}

// Color by duration: red=longest, orange=mid, yellow=shortest
// Effective duration: for DLY NOTAMs, use the per-day window; otherwise use full validity
function getEffectiveDuration(e) {
  if (!e.time || !e.time.startTs || !e.time.endTs) return 0;
  if (e.time.dailyWindows && e.time.dailyWindows.length > 0) {
    return e.time.dailyWindows[0].end - e.time.dailyWindows[0].start;
  }
  return e.time.endTs.getTime() - e.time.startTs.getTime();
}

function getDurationColor(entry, allEntries) {
  if (!entry.time || !entry.time.startTs || !entry.time.endTs) return '#FFFFFF';

  const durations = allEntries
    .filter(e => e.time && e.time.startTs && e.time.endTs)
    .map(e => getEffectiveDuration(e));

  if (durations.length === 0) return '#FFFFFF';

  const dur = getEffectiveDuration(entry);
  const minD = Math.min(...durations);
  const maxD = Math.max(...durations);

  if (maxD === minD) return '#FFAA00'; // all same duration

  const t = (dur - minD) / (maxD - minD); // 0=shortest, 1=longest

  // Yellow (#FFE820) → Orange (#FF8800) → Red (#FF3030)
  if (t < 0.5) {
    const s = t * 2; // 0-1 within yellow→orange
    const r = 255;
    const g = Math.round(232 - (232 - 136) * s);
    const b = Math.round(32 - 32 * s);
    return `rgb(${r},${g},${b})`;
  } else {
    const s = (t - 0.5) * 2; // 0-1 within orange→red
    const r = 255;
    const g = Math.round(136 - (136 - 48) * s);
    const b = Math.round(0 + 48 * s);
    return `rgb(${r},${g},${b})`;
  }
}

function makePopup(e, group, idx) {
  const nav = (group && group.length > 1)
    ? `<div class="popup-nav">
         <button class="popup-nav-btn" onclick="event.stopPropagation();cyclePopup(-1);return false;" title="Previous">&#9664;</button>
         <span class="popup-nav-label">${(idx||0)+1} / ${group.length}</span>
         <button class="popup-nav-btn" onclick="event.stopPropagation();cyclePopup(1);return false;" title="Next">&#9654;</button>
       </div>`
    : '';
  return `${nav}<div class="popup-title" style="color:${e.color}"><span class="popup-id">${esc(e.id)}</span>${(function(){ const t = extractCodename(e.text) || (e.type || "").toUpperCase(); return t ? `<span class="popup-badge" style="color:${e.color};border-color:${e.color}">${esc(t)}</span>` : ""; })()}</div>
    <div class="popup-field"><span class="f-label" style="color:${e.color}">CENTER: </span>${e.coords.map(c=>c.raw).join(', ')}</div>
    ${e.radiusNM ? `<div class="popup-field"><span class="f-label" style="color:${e.color}">RADIUS: </span>${e.radiusNM} NM</div>` : ''}
    ${e.alt ? `<div class="popup-field"><span class="f-label" style="color:#FFAA00">ALT: </span>${esc(e.alt)}</div>` : ''}
    ${e.time ? `<div class="popup-field"><span class="f-label" style="color:#888880">TIME: </span>${e.time.from} — ${e.time.to}</div>` : ''}
    <div class="popup-raw" onclick="copyNotamText(this, event)" title="Click to copy">${esc(e.text)}</div>`;
}

// === POPUP GROUP NAVIGATION ===
// When multiple NOTAMs share the same geometry, let the user cycle through them in the popup.
function geometrySignature(entry) {
  if (!entry || !entry.coords || !entry.coords.length) return null;
  if (entry.radiusNM && entry.coords.length === 1) {
    const c = entry.coords[0];
    return 'c:' + c.lat.toFixed(4) + ':' + c.lng.toFixed(4) + ':' + entry.radiusNM;
  }
  if (entry.coords.length >= 3) {
    const verts = entry.coords.map(c => c.lat.toFixed(4) + ',' + c.lng.toFixed(4)).sort().join('|');
    return 'p:' + verts;
  }
  const c = entry.coords[0];
  return 'pt:' + c.lat.toFixed(4) + ':' + c.lng.toFixed(4);
}

function groupAndBindPopups() {
  // Build groups of entries sharing the same geometry signature
  const groups = new Map();
  allNotams.forEach(entry => {
    const sig = geometrySignature(entry);
    if (!sig) return;
    if (!groups.has(sig)) groups.set(sig, []);
    groups.get(sig).push(entry);
  });
  // Sort each group by NOTAM sort key so navigation is chronological-ish
  groups.forEach(list => {
    list.sort((a, b) => {
      const ka = notamSortKey(a), kb = notamSortKey(b);
      if (ka[0] !== kb[0]) return ka[0] < kb[0] ? -1 : 1;
      if (ka[1] !== kb[1]) return ka[1] - kb[1];
      return ka[2] - kb[2];
    });
  });
  // Walk every plotted layer that has a popup and attach the group + index
  allNotams.forEach(entry => {
    const sig = geometrySignature(entry);
    const group = sig ? groups.get(sig) : [entry];
    const idxInGroup = group ? group.indexOf(entry) : 0;
    entry.layers.forEach(layer => {
      if (!layer || !layer.getPopup) return;
      if (!layer.getPopup()) return;
      layer._notamGroup = group;
      layer._notamIdx = idxInGroup;
      layer.setPopupContent(makePopup(entry, group, idxInGroup));
      // Track which layer opened the popup, so cyclePopup can update it
      if (!layer._popupBound) {
        layer.on('popupopen', function() { window.__popupLayer = layer; });
        layer._popupBound = true;
      }
    });
  });
}

function cyclePopup(dir) {
  const layer = window.__popupLayer;
  if (!layer || !layer._notamGroup) return;
  const g = layer._notamGroup;
  layer._notamIdx = ((layer._notamIdx || 0) + dir + g.length) % g.length;
  const next = g[layer._notamIdx];
  layer.setPopupContent(makePopup(next, g, layer._notamIdx));
}

// === TIMELINE ===
// Cache of unique sorted event timestamps for snap-to-event
let timelineEvents = [];

function rebuildTimeline() {
  const withTime = allNotams.filter(n => n.time && n.time.startTs && n.time.endTs);
  const panel = document.getElementById('timelinePanel');

  if (withTime.length === 0) {
    panel.classList.add('hidden');
    timelineEvents = [];
    return;
  }

  panel.classList.remove('hidden');

  const earliest = Math.min(...withTime.map(n => n.time.startTs.getTime()));
  const latest = Math.max(...withTime.map(n => n.time.endTs.getTime()));

  const slider = document.getElementById('timelineSlider');
  slider.min = earliest;
  slider.max = latest;

  // Default to earliest
  if (parseFloat(slider.value) < earliest || parseFloat(slider.value) > latest) {
    slider.value = earliest;
  }

  document.getElementById('timelineStart').textContent = fmtTimeline(new Date(earliest));
  document.getElementById('timelineEnd').textContent = fmtTimeline(new Date(latest));

  // === BUILD SPAN BARS + TICK MARKS + EVENT LIST ===
  const ticksEl = document.getElementById('timelineTicks');
  ticksEl.innerHTML = '';
  const span = latest - earliest;
  const eventSet = new Set();

  // Lane packing — up to 3 lanes, minimising total pairwise overlap.
  // Each lane stores its concrete active intervals (for DLY NOTAMs: one per day window).
  const MAX_LANES = 3;
  const laneIntervals = [[], [], []];
  const laneOf = new Map(); // entry uid -> lane index

  function entryActiveIntervals(n) {
    if (n.time.dailyWindows && n.time.dailyWindows.length > 0) {
      return n.time.dailyWindows.map(w => ({ start: w.start, end: w.end }));
    }
    return [{ start: n.time.startTs.getTime(), end: n.time.endTs.getTime() }];
  }

  function intervalOverlap(a, b) {
    return Math.max(0, Math.min(a.end, b.end) - Math.max(a.start, b.start));
  }

  // Sort by total active duration descending so long NOTAMs claim lanes first
  const sortedForPacking = withTime.slice().sort((a, b) => {
    const aIvs = entryActiveIntervals(a);
    const bIvs = entryActiveIntervals(b);
    const aDur = aIvs.reduce((s, iv) => s + (iv.end - iv.start), 0);
    const bDur = bIvs.reduce((s, iv) => s + (iv.end - iv.start), 0);
    return bDur - aDur;
  });

  sortedForPacking.forEach(n => {
    const ivs = entryActiveIntervals(n);
    let bestLane = 0;
    let bestOverlap = Infinity;
    for (let i = 0; i < MAX_LANES; i++) {
      let total = 0;
      for (const newIv of ivs) {
        for (const existing of laneIntervals[i]) {
          total += intervalOverlap(newIv, existing);
        }
      }
      // Prefer earliest lane on ties so we don't leave empty lanes
      if (total < bestOverlap) {
        bestOverlap = total;
        bestLane = i;
        if (total === 0) break;
      }
    }
    ivs.forEach(iv => laneIntervals[bestLane].push(iv));
    laneOf.set(n.uid, bestLane);
  });

  function laneGeometry(laneIdx) {
    // Container is 18px. Top padding 1px, 5px lane, 1px gap, 5px lane, 1px gap, 5px lane, 0px.
    return { top: 1 + laneIdx * 6, height: 5 };
  }

  // Render in original order (stable) so z-order follows the NOTAM order
  withTime.forEach(n => {
    const lane = laneOf.get(n.uid) || 0;
    const g = laneGeometry(lane);
    if (n.time.dailyWindows && n.time.dailyWindows.length > 0) {
      n.time.dailyWindows.forEach(w => {
        addSpan(ticksEl, w.start, w.end, earliest, span, n.color, n, g.top, g.height);
        eventSet.add(w.start);
        eventSet.add(w.end);
      });
    } else {
      const s = n.time.startTs.getTime();
      const e = n.time.endTs.getTime();
      addSpan(ticksEl, s, e, earliest, span, n.color, n, g.top, g.height);
      eventSet.add(s);
      eventSet.add(e);
    }
  });

  renderEAMs(ticksEl, earliest, span);

  // Always include earliest and latest as snap targets
  eventSet.add(earliest);
  eventSet.add(latest);
  timelineEvents = Array.from(eventSet).sort((a, b) => a - b);

  // Bind popup group navigation (idempotent — safe to call repeatedly)
  try { groupAndBindPopups(); } catch(e) {}

  onTimelineChange();
}

function addTick(container, ts, earliest, span, color, type) {
  if (span <= 0) return;
  const pct = ((ts - earliest) / span) * 100;
  if (pct < 0 || pct > 100) return;
  const tick = document.createElement('div');
  tick.className = 'tick ' + type;
  tick.style.left = pct + '%';
  tick.style.color = color;
  container.appendChild(tick);
}

function addSpan(container, startTs, endTs, earliest, totalSpan, color, entry, top, height) {
  if (totalSpan <= 0) return;
  const leftPct = ((startTs - earliest) / totalSpan) * 100;
  const widthPct = ((endTs - startTs) / totalSpan) * 100;
  if (widthPct <= 0) return;
  const bar = document.createElement('div');
  bar.className = 'span-bar';
  bar.style.left = leftPct + '%';
  bar.style.width = Math.max(widthPct, 0.2) + '%';
  if (typeof top === 'number') bar.style.top = top + 'px';
  if (typeof height === 'number') {
    bar.style.height = height + 'px';
    bar.style.bottom = 'auto';
  }
  // Translucent fill so overlaps stack visibly
  bar.style.background = hexToRgba(color, 0.5);
  // Tooltip on hover — just the NOTAM id
  if (entry) {
    bar.title = entry.id;
    bar.addEventListener('click', function(ev){
      ev.stopPropagation();
      flyTo(entry.uid);
    });
  }
  container.appendChild(bar);
}

const EAM_GROUP_COLORS = { 1:'#06b050', 2:'#ff9000', 3:'#ffcc00', 4:'#ff0467', 5:'#9063cd', 0:'#556677' };
function renderEAMs(container, earliest, totalSpan) {
  if (!Array.isArray(EAM_DATA) || totalSpan <= 0) return;
  const fmt = ts => {
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getUTCMonth()+1)+'/'+pad(d.getUTCDate())+' '+
           pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+'Z';
  };
  EAM_DATA.forEach(e => {
    const pct = ((e.t - earliest) / totalSpan) * 100;
    if (pct < 0 || pct > 100) return;
    const dot = document.createElement('div');
    dot.className = 'eam-dot';
    dot.style.left = pct + '%';
    dot.style.background = EAM_GROUP_COLORS[e.g] || EAM_GROUP_COLORS[0];
    dot.title = `EAM — ${fmt(e.t)}  ${e.cs}  ${e.p6} (${e.cl})`;
    container.appendChild(dot);
  });
}

// Convert #rrggbb or rgb(...) to rgba with given alpha
function hexToRgba(color, alpha) {
  if (!color) return 'rgba(255,255,255,' + alpha + ')';
  if (color[0] === '#') {
    const hex = color.slice(1);
    const r = parseInt(hex.slice(0,2), 16);
    const g = parseInt(hex.slice(2,4), 16);
    const b = parseInt(hex.slice(4,6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
  const m = /^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/.exec(color);
  if (m) return 'rgba(' + m[1] + ',' + m[2] + ',' + m[3] + ',' + alpha + ')';
  return color;
}

function snapToEvent(direction) {
  if (timelineEvents.length === 0) return;
  const slider = document.getElementById('timelineSlider');
  const cur = parseFloat(slider.value);
  let target = null;
  if (direction > 0) {
    // Next event strictly after current
    for (const ts of timelineEvents) {
      if (ts > cur + 100) { target = ts; break; }
    }
    if (target === null) target = timelineEvents[timelineEvents.length - 1];
  } else {
    // Previous event strictly before current
    for (let i = timelineEvents.length - 1; i >= 0; i--) {
      if (timelineEvents[i] < cur - 100) { target = timelineEvents[i]; break; }
    }
    if (target === null) target = timelineEvents[0];
  }
  // Pause auto-play and jump
  if (typeof window.__tlPlaying !== 'undefined') window.__tlPlaying = false;
  slider.value = target;
  onTimelineChange();
}

function onTimelineChange() {
  if (showAll) return;

  const ts = parseFloat(document.getElementById('timelineSlider').value);
  const currentDate = new Date(ts);
  document.getElementById('timelineCurrent').textContent = fmtTimeline(currentDate);

  let activeCount = 0;

  allNotams.forEach(n => {
    let isActive;
    if (n.time && n.time.startTs && n.time.endTs) {
      if (n.time.dailyWindows) {
        // DLY: only active during specific daily windows
        isActive = n.time.dailyWindows.some(w => ts >= w.start && ts <= w.end);
      } else {
        isActive = ts >= n.time.startTs.getTime() && ts <= n.time.endTs.getTime();
      }
    } else {
      isActive = true;
    }

    if (isActive) activeCount++;
    const opacity = isActive ? 1 : 0.08;

    n.layers.forEach(l => {
      if (l.setOpacity) l.setOpacity(opacity);
      if (l.setStyle) l.setStyle({ opacity, fillOpacity: isActive ? 0.12 : 0.01 });
      // For DivIcon markers (labels)
      if (l._icon) l._icon.style.opacity = opacity;
    });

    // Dim card in list
    const card = document.querySelector(`[data-uid="${n.uid}"]`);
    if (card) card.classList.toggle('dimmed', !isActive);
  });

  document.getElementById('timelineActive').textContent = `${activeCount}/${allNotams.length} ACTIVE`;
}

function toggleShowAll() {
  showAll = !showAll;
  const btn = document.getElementById('btnShowAll');
  btn.classList.toggle('active', showAll);
  btn.textContent = showAll ? 'FILTERING' : 'SHOW ALL';

  if (showAll) {
    document.getElementById('timelineCurrent').textContent = 'ALL';
    document.getElementById('timelineActive').textContent = `${allNotams.length}/${allNotams.length} ACTIVE`;
    allNotams.forEach(n => {
      n.layers.forEach(l => {
        if (l.setOpacity) l.setOpacity(1);
        if (l.setStyle) l.setStyle({ opacity: 1, fillOpacity: 0.12 });
        if (l._icon) l._icon.style.opacity = 1;
      });
      const card = document.querySelector(`[data-uid="${n.uid}"]`);
      if (card) card.classList.remove('dimmed');
    });
  } else {
    onTimelineChange();
  }
}

// === ADD ===
function addNOTAMs() {
  const raw = document.getElementById('notamInput').value;
  if (!raw.trim()) return;

  const notams = raw.replace(/\r\n/g,'\n').split(/(?=![A-Z]{3,4}\s+\d{2}\/\d{1,4})/).filter(s=>s.trim());
  let added = 0;

  // First pass: parse all NOTAMs
  const parsed = [];
  notams.forEach(nt => {
    try {
      const flat = nt.replace(/\n/g,' ').trim();
      const coords = parseDMS(flat);
      const radiusNM = parseRadius(flat);
      const alt = parseAlt(flat);
      const time = parseTime(flat);
      const id = parseId(flat);
      if (!coords.length) return;
      const uid = Date.now() + '_' + Math.random().toString(36).slice(2,8);
      parsed.push({ id, uid, color: '#FFFFFF', coords, radiusNM, alt, time, text: flat, layers: [] });
    } catch(err) { console.error('Parse error:', err, nt.slice(0,60)); }
  });

  // Assign colors by duration
  parsed.forEach(entry => { entry.color = getDurationColor(entry, parsed); });

  // Second pass: plot on map
  parsed.forEach(entry => {
    try {
    const color = entry.color;
    let labelLL;

    if (entry.radiusNM && entry.coords.length >= 1) {
      const c = [entry.coords[0].lat, entry.coords[0].lng];
      labelLL = c;
      const circle = L.circle(c, {
        radius: nmToM(entry.radiusNM), color, fillColor: color, fillOpacity: 0.12, weight: 2, dashArray: '6 3'
      }).addTo(map);
      const dot = L.circleMarker(c, { radius: 4, color, fillColor: color, fillOpacity: 1, weight: 2 }).addTo(map);
      const popup = makePopup(entry);
      circle.bindPopup(popup); dot.bindPopup(popup);
      entry.layers.push(circle, dot);
      entry.type = 'circle';

    } else if (entry.coords.length >= 3) {
      const areasToRender = (entry.areas && entry.areas.length > 0) ? entry.areas : [entry.coords];
      areasToRender.forEach((areaCoords, areaIdx) => {
        const ll = areaCoords.map(c => [c.lat, c.lng]);
        const poly = L.polygon(ll, { color, fillColor: color, fillOpacity: 0.12, weight: 2, dashArray: '6 3' }).addTo(map);
        poly.bindPopup(makePopup(entry));
        entry.layers.push(poly);
        if (areaIdx === 0) {
          const ctr = poly.getBounds().getCenter();
          labelLL = [ctr.lat, ctr.lng];
        }
        areaCoords.forEach(c => {
          const mk = L.circleMarker([c.lat, c.lng], { radius: 3, color, fillColor: color, fillOpacity: 0.9, weight: 2 }).addTo(map);
          entry.layers.push(mk);
        });
      });
      entry.type = 'polygon';

    } else {
      labelLL = [entry.coords[0].lat, entry.coords[0].lng];
      entry.coords.forEach(c => {
        const mk = L.circleMarker([c.lat, c.lng], { radius: 5, color, fillColor: color, fillOpacity: 0.9, weight: 2 }).addTo(map);
        mk.bindPopup(makePopup(entry));
        entry.layers.push(mk);
      });
      entry.type = 'point';
    }

    entry.layers.push(makeLabel(labelLL, entry));
    allNotams.push(entry);
    added++;
    } catch(err) { console.error('Plot error:', err, entry.id); }
  });

  if (added) {
    document.getElementById('notamInput').value = '';
    updateList();
    rebuildTimeline();
    fitAll();
  }
}

function removeNotam(uid) {
  const i = allNotams.findIndex(n=>n.uid===uid);
  if (i===-1) return;
  allNotams[i].layers.forEach(l=>map.removeLayer(l));
  allNotams.splice(i,1);
  updateList();
  rebuildTimeline();
}

// Compute padding so map content sits in the left ~75% of the viewport
function leftBiasedPadding() {
  const w = window.innerWidth || document.documentElement.clientWidth || 1000;
  return {
    paddingTopLeft: [0, 0],
    paddingBottomRight: [Math.round(w * 0.25), 0]
  };
}

function flyTo(uid) {
  const e = allNotams.find(n=>n.uid===uid);
  if (!e) return;
  if (e.type==='circle' && e.radiusNM) {
    map.fitBounds(L.circle([e.coords[0].lat,e.coords[0].lng],{radius:nmToM(e.radiusNM)}).getBounds().pad(0.3), leftBiasedPadding());
  } else {
    const g = L.featureGroup(e.layers.filter(l=>l.getBounds||l.getLatLng));
    if (g.getLayers().length) map.fitBounds(g.getBounds().pad(0.3), leftBiasedPadding());
  }
}

// Sort key: prefix (e.g. CARF), then year, then number
// Extract the operation codename from a NOTAM's raw text.
// Returns something like "KELLY THREE", "SHADO (IBEX)", "MONK 2 (OAK BRAVO)",
// "SHADO (IBEX / OAK ALPHA)", or null if nothing matches.
function extractCodename(text) {
  if (!text) return null;
  const t = text.toUpperCase();

  // DCC-prefixed ZAK-style ops
  const dcc = /DCC\s+(KELLY|BRAVO|IRON|ECHO|DELTA|GOLF|HOTEL|XRAY|YANKEE|ZULU)\s+THREE/.exec(t);
  if (dcc) return dcc[1] + ' THREE';

  // Generic DCC <name> followed by STNR (catches things like "DCC TRAILING WIRE")
  const dcc2 = /DCC\s+([A-Z][A-Z0-9 ]*?)\s+STNR/.exec(t);
  if (dcc2) return dcc2[1].trim();

  // Named reservations with aircraft in parens — collect all distinct aircraft identifiers
  // Operation name: first word after "RESERVATION" (may include a trailing number)
  const opMatch = /RESERVATION[\s,]+([A-Z][A-Z0-9]*(?:\s+\d+)?)[\s,]*\(/.exec(t);
  if (opMatch) {
    const op = opMatch[1].trim();
    // Collect every (AIRCRAFT) group that follows (IBEX, OAK ALPHA, OAK BRAVO, etc.)
    const aircraft = [];
    const re = /\(([A-Z][A-Z ]*)\)/g;
    let m;
    while ((m = re.exec(t)) !== null) {
      const code = m[1].trim();
      // Skip short generic tokens that aren't operation aircraft (e.g. IFR in parens, if any)
      if (/^(IBEX|CIRCUS|MANATEE|NOVEMBER|OAK ALPHA|OAK BRAVO|OAK CHARLIE|OAK DELTA|OAK OSCAR)$/.test(code)) {
        if (!aircraft.includes(code)) aircraft.push(code);
      }
    }
    if (aircraft.length > 0) return op + ' (' + aircraft.join(' / ') + ')';
    return op;
  }

  // RESERVATION <NAME> with no aircraft parens (e.g. "RESERVATION CGULL WI ...")
  const opOnly = /RESERVATION[\s,]+([A-Z][A-Z0-9]*(?:\s+\d+)?)\s+(WI|W\/I)\b/.exec(t);
  if (opOnly) return opOnly[1].trim();

  return null;
}

function notamSortKey(e) {
  const m = /^(\S+)\s+(\d+)\/(\d+)/.exec(e.id || '');
  if (!m) return ['~', 0, 0];
  return [m[1], parseInt(m[2],10), parseInt(m[3],10)];
}

function updateList() {
  const body = document.getElementById('listBody');
  const ct = allNotams.length;
  document.getElementById('listCount').textContent = String(ct).padStart(2,'0');

  if (!ct) {
    body.innerHTML = '<div class="no-data">NO DATA<br><span class="jp-empty">データなし</span></div>';
    return;
  }

  // Sort a copy of allNotams by ID without mutating the source array
  const sorted = allNotams.slice().sort((a, b) => {
    const ka = notamSortKey(a), kb = notamSortKey(b);
    if (ka[0] !== kb[0]) return ka[0] < kb[0] ? -1 : 1;
    if (ka[1] !== kb[1]) return ka[1] - kb[1];
    return ka[2] - kb[2];
  });

  const nowTs = Date.now();
  body.innerHTML = sorted.map(e => {
    const expired = !!(e.time && e.time.endTs && e.time.endTs.getTime() < nowTs);
    return `
    <div class="notam-card${expired ? ' expired' : ''}" data-uid="${e.uid}" style="border-left-color:${e.color};" onclick="flyTo('${e.uid}')">
      <div class="notam-card-header">
        <span class="notam-card-id" style="color:${e.color}" ${expired ? `onclick="event.stopPropagation(); this.closest('.notam-card').classList.toggle('expanded');"` : ''}>${esc(e.id)}</span>
        <span class="notam-card-type" style="color:${e.color};border-color:${e.color};">${esc(extractCodename(e.text) || (e.type || '').toUpperCase())}</span>
        <button class="notam-card-remove" onclick="event.stopPropagation();removeNotam('${e.uid}')" title="Remove">X</button>
      </div>
      <div class="notam-card-details">
        ${e.coords.map(c=>c.raw).join(', ')}${e.radiusNM ? ` / ${e.radiusNM}NM` : ''}${e.alt ? ` / ${esc(e.alt)}` : ''}
        ${e.time ? `<br>${e.time.from} — ${e.time.to}` : ''}
      </div>
      <div class="notam-card-text" onclick="copyNotamText(this, event)" title="Click to copy">${esc(e.text)}</div>
    </div>
  `;
  }).join('');
}

  const all = allNotams.flatMap(n=>n.layers.filter(l=>l.getBounds||l.getLatLng));
  if (all.length) map.fitBounds(L.featureGroup(all).getBounds().pad(0.2), leftBiasedPadding());
}

function clearAll() {
  allNotams.forEach(n=>n.layers.forEach(l=>map.removeLayer(l)));
  allNotams.length = 0;
  document.getElementById('notamInput').value = '';
  updateList(); rebuildTimeline();
}

}


// Click NOTAM text to copy to clipboard
function copyNotamText(el, ev) {
  if (ev) ev.stopPropagation();
  const text = el.textContent || el.innerText || "";
  if (!text.trim()) return;
  const flash = () => {
    el.classList.add("copied");
    setTimeout(() => el.classList.remove("copied"), 700);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(flash).catch(() => {});
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); flash(); } catch(e){}
    ta.remove();
  }
}

      }

      entry.layers.push(makeLabel(labelLL, entry));
      allNotams.push(entry);
      added++;
    } catch(err) { console.error('Plot error:', err, entry.id); }
  });

  if (added) {
    updateList();
    rebuildTimeline();
    fitAll();

    // Auto-tab through events at 1-second intervals — same effect as the
    // user repeatedly clicking the ▶ snap button. User interaction with
    // the timeline permanently ends the automated playback.
    const slider = document.getElementById('timelineSlider');
    function stopAuto() {
      if (autoTick !== null) { clearInterval(autoTick); autoTick = null; }
    }
    let autoTick = setInterval(function() {
      if (!timelineEvents || timelineEvents.length === 0) return;
      const cur = parseFloat(slider.value);
      let target = null;
      for (const ts of timelineEvents) {
        if (ts > cur + 100) { target = ts; break; }
      }
      // Wrap to first event when we run off the end
      if (target === null) target = timelineEvents[0];
      slider.value = target;
      onTimelineChange();
    }, 1000);
    slider.addEventListener('input', stopAuto);
    slider.addEventListener('pointerdown', stopAuto);
    slider.addEventListener('keydown', stopAuto);
    document.getElementById('snapPrev').addEventListener('click', stopAuto);
    document.getElementById('snapNext').addEventListener('click', stopAuto);
  }
})();
</script>
</body>
</html>
