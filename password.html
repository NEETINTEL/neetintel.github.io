<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TELL ME YOUR PASSWORD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #888; font-family: monospace; height: 100vh; display: flex; align-items: center; justify-content: center; }
  body::before {
    content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
    pointer-events: none; z-index: 9999;
  }
  body::after {
    content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 50%, rgba(0,0,0,0.6) 100%);
    pointer-events: none; z-index: 9998;
  }
  .scan-line {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    background: rgba(255,255,255,0.04); z-index: 9997;
    pointer-events: none; animation: scanmove 4s linear infinite;
  }
  @keyframes scanmove { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }
  .gate { text-align: center; }
  .gate .label { font-size: 9px; letter-spacing: 0.2em; color: #444; margin-bottom: 10px; text-transform: uppercase; }
  .gate input {
    background: #000; border: 1px solid #333; color: #fff; padding: 8px 12px;
    font-family: monospace; font-size: 14px; text-align: center;
    outline: none; letter-spacing: 0.1em; width: 200px;
  }
  .gate input:focus { border-color: #666; }
  .gate input::placeholder { color: #333; }
  .gate .err { color: #600; font-size: 10px; margin-top: 8px; height: 14px; }
</style>
</head>
<body>
<div class="scan-line"></div>
<div class="gate">
  <div class="label">Enter password</div>
  <input type="password" id="pw" placeholder="" autofocus>
  <div class="err" id="err"></div>
</div>

const I=100000;
function b(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
// Ambient audio on password page — split into drone + shimmer buses
(function(){
  function sa(){
    if(window.__pa)return;
    try{
      const c=new(window.AudioContext||window.webkitAudioContext)();
      window.__pa=c;
      const m=c.createGain();m.gain.value=0;m.gain.linearRampToValueAtTime(0.25,c.currentTime+3);m.connect(c.destination);
      window.__pm=m;
      // Drone bus: bass + sub + 5th
      const drone=c.createGain();drone.gain.value=1;drone.connect(m);
      // Shimmer bus: high shimmer + filtered noise (the "beeping" components)
      const shim=c.createGain();shim.gain.value=1;shim.connect(m);
      window.__psh=shim;

      const b1=c.createOscillator();b1.type='sine';b1.frequency.value=55;const b1g=c.createGain();b1g.gain.value=0.3;b1.connect(b1g);b1g.connect(drone);b1.start();
      const b2=c.createOscillator();b2.type='sine';b2.frequency.value=55.15;const b2g=c.createGain();b2g.gain.value=0.3;b2.connect(b2g);b2g.connect(drone);b2.start();
      const s=c.createOscillator();s.type='sine';s.frequency.value=27.5;const sg=c.createGain();sg.gain.value=0.15;s.connect(sg);sg.connect(drone);s.start();
      const sl=c.createOscillator();sl.type='sine';sl.frequency.value=0.08;const slg=c.createGain();slg.gain.value=0.1;sl.connect(slg);slg.connect(sg.gain);sl.start();
      const bs=c.sampleRate*2,nb=c.createBuffer(1,bs,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<bs;i++)nd[i]=Math.random()*2-1;
      const n=c.createBufferSource();n.buffer=nb;n.loop=true;const nf=c.createBiquadFilter();nf.type='bandpass';nf.frequency.value=800;nf.Q.value=2;const ng=c.createGain();ng.gain.value=0.03;n.connect(nf);nf.connect(ng);ng.connect(shim);n.start();
      const fl=c.createOscillator();fl.type='sine';fl.frequency.value=0.03;const flg=c.createGain();flg.gain.value=400;fl.connect(flg);flg.connect(nf.frequency);fl.start();
      const h1=c.createOscillator();h1.type='sine';h1.frequency.value=3520;const h1g=c.createGain();h1g.gain.value=0.008;h1.connect(h1g);h1g.connect(shim);h1.start();
      const h2=c.createOscillator();h2.type='sine';h2.frequency.value=3525;const h2g=c.createGain();h2g.gain.value=0.008;h2.connect(h2g);h2g.connect(shim);h2.start();
      const hl=c.createOscillator();hl.type='sine';hl.frequency.value=0.05;const hlg=c.createGain();hlg.gain.value=0.006;hl.connect(hlg);hlg.connect(h1g.gain);hl.start();
      const f=c.createOscillator();f.type='triangle';f.frequency.value=82.4;const fg=c.createGain();fg.gain.value=0.06;f.connect(fg);fg.connect(drone);f.start();
      const ffl=c.createOscillator();ffl.type='sine';ffl.frequency.value=0.02;const fflg=c.createGain();fflg.gain.value=0.4;ffl.connect(fflg);fflg.connect(f.frequency);ffl.start();

  }

  document.addEventListener('keydown',sa,{once:true});
  document.addEventListener('touchstart',sa,{once:true});
})();
async function tryDecrypt(pw,entry){
  const s=b(entry.s),v=b(entry.v),t=b(entry.t),d=b(entry.d);
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const dk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:I,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  const ct=new Uint8Array(d.length+t.length);ct.set(d);ct.set(t,d.length);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:v},dk,ct);
  return new TextDecoder().decode(pt);
}
document.getElementById('pw').addEventListener('keydown',async function(e){
  if(e.key!=='Enter')return;
  const p=this.value.toUpperCase();
  if(!p)return;
  for(const entry of P){
    try{
      const html=await tryDecrypt(p,entry);
      document.open();document.write(html);document.close();
      return;
    }catch(x){}
  }
  document.getElementById('err').textContent='\u2715';
  this.value='';
  // Error sound — harsh DU-DUHH buzzer (two stacked square hits, second one lower & longer)
  try{
    const ec = window.__pa || new (window.AudioContext||window.webkitAudioContext)();
    function hit(t, freq, dur, vel){
      // Two stacked saws for harshness
      const o1 = ec.createOscillator();
      o1.type = 'sawtooth';
      o1.frequency.value = freq;
      const o2 = ec.createOscillator();
      o2.type = 'square';
      o2.frequency.value = freq * 1.005; // slightly detuned for grit
      const o3 = ec.createOscillator();
      o3.type = 'sawtooth';
      o3.frequency.value = freq * 0.5; // octave below
      const filt = ec.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.value = 900;
      filt.Q.value = 1.2;
      const env = ec.createGain();
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(vel, t + 0.002);
      env.gain.linearRampToValueAtTime(vel, t + dur - 0.02);
      env.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o1.connect(filt); o2.connect(filt); o3.connect(filt);
      filt.connect(env); env.connect(ec.destination);
      o1.start(t); o2.start(t); o3.start(t);
      o1.stop(t + dur + 0.02); o2.stop(t + dur + 0.02); o3.stop(t + dur + 0.02);
      // Noise transient at attack
      const nbuf = ec.createBuffer(1, ec.sampleRate * 0.025, ec.sampleRate);
      const nd = nbuf.getChannelData(0);
      for(let i=0;i<nd.length;i++) nd[i] = (Math.random()*2-1) * (1 - i/nd.length);
      const ns = ec.createBufferSource();
      ns.buffer = nbuf;
      const ng = ec.createGain();
      ng.gain.value = vel * 0.35;
      ns.connect(ng); ng.connect(ec.destination);
      ns.start(t);
    }
    const t0 = ec.currentTime;
    // DU — short higher hit (low register)
    hit(t0,         98,  0.10, 0.10);
    // DUHH — longer lower hit (minor third down, even lower)
    hit(t0 + 0.13,  73,  0.36, 0.12);
  }catch(e){}
});
